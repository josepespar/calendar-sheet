<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="lp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.78"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky / exterior background -->
  <rect width="1600" height="700" fill="#1A1A1A"/>
  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- Building facade -->
  <rect x="780" y="80" width="820" height="620" rx="4" fill="#2A2A2A"/>
  <!-- Glass doors -->
  <rect x="1060" y="350" width="130" height="260" rx="4" fill="#3A4A5A" opacity="0.8"/>
  <rect x="1200" y="350" width="130" height="260" rx="4" fill="#3A4A5A" opacity="0.8"/>
  <line x1="1125" y1="350" x2="1125" y2="610" stroke="#AAC" stroke-width="2" opacity="0.5"/>
  <line x1="1265" y1="350" x2="1265" y2="610" stroke="#AAC" stroke-width="2" opacity="0.5"/>
  <!-- Door handle -->
  <rect x="1145" y="470" width="25" height="8" rx="4" fill="#AAA"/>
  <rect x="1220" y="470" width="25" height="8" rx="4" fill="#AAA"/>
  <!-- Façana windows -->
  <rect x="820"  y="130" width="180" height="100" rx="4" fill="#3A4A5A" opacity="0.6"/>
  <rect x="1020" y="130" width="180" height="100" rx="4" fill="#3A4A5A" opacity="0.6"/>
  <rect x="1220" y="130" width="180" height="100" rx="4" fill="#3A4A5A" opacity="0.6"/>
  <rect x="1420" y="130" width="140" height="100" rx="4" fill="#3A4A5A" opacity="0.6"/>
  <!-- FitCore sign on building -->
  <rect x="880" y="260" width="480" height="70" rx="8" fill="#111"/>
  <text x="1120" y="307" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="900" text-anchor="middle">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <!-- Sign secondary text -->
  <text x="1120" y="355" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#888" text-anchor="middle" letter-spacing="3">CENTRE DE FITNESS</text>
  <!-- Pavement -->
  <rect x="780" y="610" width="820" height="90" fill="#222"/>
  <!-- Pavement lines -->
  <line x1="780" y1="640" x2="1600" y2="640" stroke="#333" stroke-width="2"/>
  <line x1="780" y1="670" x2="1600" y2="670" stroke="#333" stroke-width="1" opacity="0.5"/>
  <!-- Bike rack -->
  <rect x="1490" y="570" width="8" height="60" rx="4" fill="#555"/>
  <rect x="1520" y="570" width="8" height="60" rx="4" fill="#555"/>
  <ellipse cx="1504" cy="590" rx="18" ry="18" fill="none" stroke="#555" stroke-width="5"/>

  <!-- Left overlay for text -->
  <rect width="1600" height="700" fill="url(#lp)"/>

  <!-- FitCore wordmark top -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="128" width="160" height="4" rx="2" fill="#FF6B35"/>
  <text x="60" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#FF6B35" font-weight="700" letter-spacing="3">ACTE I · EL MÓN ORDINARI</text>
  <text x="60" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">Benvinguts</text>
  <text x="60" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">a FitCore</text>
  <text x="60" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#AAA">L'equip al complet</text>

  <!-- CHARACTERS on pavement in front of building -->
  <!-- Hanna (green, curly brown hair, pink outfit) -->
  <g transform="translate(840,320)">
    <!-- hair back -->
    <ellipse cx="0" cy="-168" rx="38" ry="45" fill="#5C3A1E"/>
    <!-- body -->
    <rect x="-38" y="-110" width="76" height="130" rx="18" fill="#E91E8C"/>
    <!-- arms -->
    <rect x="-62" y="-100" width="26" height="80" rx="13" fill="#E91E8C"/>
    <rect x="36" y="-100" width="26" height="80" rx="13" fill="#E91E8C"/>
    <!-- bag -->
    <rect x="40" y="-30" width="32" height="42" rx="6" fill="#8B5CF6"/>
    <rect x="52" y="-45" width="8" height="20" rx="4" fill="#7C3AED"/>
    <!-- pants -->
    <rect x="-34" y="20" width="30" height="110" rx="10" fill="#8B5CF6"/>
    <rect x="4" y="20" width="30" height="110" rx="10" fill="#8B5CF6"/>
    <!-- shoes -->
    <ellipse cx="-19" cy="136" rx="22" ry="12" fill="#9333EA"/>
    <ellipse cx="19" cy="136" rx="22" ry="12" fill="#9333EA"/>
    <!-- head -->
    <circle cx="0" cy="-168" r="40" fill="#FDBCB4"/>
    <!-- hair front (curly) -->
    <path d="M-38,-185 Q-45,-215 -25,-225 Q0,-235 25,-225 Q45,-215 38,-185" fill="#5C3A1E"/>
    <circle cx="-30" cy="-195" r="12" fill="#5C3A1E"/>
    <circle cx="30" cy="-195" r="12" fill="#5C3A1E"/>
    <!-- eyes -->
    <ellipse cx="-13" cy="-174" rx="6" ry="7" fill="#FFF"/>
    <ellipse cx="13" cy="-174" rx="6" ry="7" fill="#FFF"/>
    <circle cx="-13" cy="-173" r="4" fill="#333"/>
    <circle cx="13" cy="-173" r="4" fill="#333"/>
    <!-- smile -->
    <path d="M-10,-155 Q0,-148 10,-155" stroke="#C0392B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- FitCore badge -->
    <rect x="-14" y="-90" width="28" height="22" rx="4" fill="#FF6B35"/>
    <text x="0" y="-74" font-family="system-ui,sans-serif" font-size="9" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- name -->
    <text x="0" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#27AE60" text-anchor="middle" font-weight="700">HANNA</text>
    <text x="0" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Mentora</text>
  </g>

  <!-- Harry (blue hoodie, dark pants) -->
  <g transform="translate(1020,300)">
    <!-- hair back -->
    <ellipse cx="0" cy="-185" rx="42" ry="30" fill="#4A2C0A"/>
    <!-- body hoodie -->
    <rect x="-42" y="-118" width="84" height="145" rx="18" fill="#4A90D9"/>
    <!-- arms -->
    <rect x="-68" y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <rect x="40" y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <!-- bag strap -->
    <rect x="-52" y="-118" width="10" height="145" rx="5" fill="#2C5F8A"/>
    <rect x="-52" y="15" width="52" height="14" rx="6" fill="#2C5F8A"/>
    <rect x="-12" y="-90" width="24" height="40" rx="6" fill="#1A3A5C"/>
    <!-- pants -->
    <rect x="-36" y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <rect x="4" y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <!-- shoes -->
    <ellipse cx="-20" cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <ellipse cx="20" cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <!-- head -->
    <circle cx="0" cy="-185" r="44" fill="#FDBCB4"/>
    <!-- hair front -->
    <path d="M-42,-198 Q-40,-225 -20,-232 Q0,-238 20,-232 Q40,-225 42,-198" fill="#4A2C0A"/>
    <!-- eyes -->
    <ellipse cx="-14" cy="-192" rx="7" ry="8" fill="#FFF"/>
    <ellipse cx="14" cy="-192" rx="7" ry="8" fill="#FFF"/>
    <circle cx="-14" cy="-191" r="4.5" fill="#333"/>
    <circle cx="14" cy="-191" r="4.5" fill="#333"/>
    <!-- smile -->
    <path d="M-10,-172 Q0,-165 10,-172" stroke="#C0392B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- FC badge on hoodie -->
    <rect x="-12" y="-100" width="24" height="20" rx="4" fill="#2C5F8A"/>
    <text x="0" y="-85" font-family="system-ui,sans-serif" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- name -->
    <text x="0" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle" font-weight="700">HARRY</text>
    <text x="0" y="207" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Protagonista</text>
  </g>

  <!-- Jack (red tank, shaved head, sunglasses) -->
  <g transform="translate(1220,310)">
    <!-- No hair (shaved) / stubble -->
    <circle cx="0" cy="-175" r="42" fill="#2A1A0A"/>
    <!-- Muscular body - red tank -->
    <rect x="-46" y="-112" width="92" height="140" rx="16" fill="#C0392B"/>
    <!-- Tank top straps -->
    <rect x="-46" y="-112" width="20" height="60" rx="10" fill="#C0392B"/>
    <rect x="26"  y="-112" width="20" height="60" rx="10" fill="#C0392B"/>
    <!-- Arms (muscular) -->
    <rect x="-76" y="-105" width="32" height="100" rx="16" fill="#C07A52"/>
    <rect x="44"  y="-105" width="32" height="100" rx="16" fill="#C07A52"/>
    <!-- Bag -->
    <rect x="-44" y="0" width="38" height="50" rx="8" fill="#1A1A1A"/>
    <rect x="-30" y="-15" width="10" height="20" rx="5" fill="#111"/>
    <!-- Shorts -->
    <rect x="-40" y="28" width="36" height="90" rx="10" fill="#111"/>
    <rect x="4"   y="28" width="36" height="90" rx="10" fill="#111"/>
    <!-- Slides/sandals -->
    <ellipse cx="-22" cy="124" rx="28" ry="11" fill="#333"/>
    <rect x="-38"  cy="115" width="32" height="9" rx="4" fill="#555"/>
    <ellipse cx="22" cy="124" rx="28" ry="11" fill="#333"/>
    <rect x="6"    cy="115" width="32" height="9" rx="4" fill="#555"/>
    <!-- Head (shaved = very close to skin) -->
    <circle cx="0" cy="-175" r="40" fill="#C07A52"/>
    <!-- Very short hair -->
    <path d="M-40,-195 Q0,-215 40,-195 L38,-175 Q0,-182 -38,-175 Z" fill="#2A1A0A" opacity="0.5"/>
    <!-- Sunglasses -->
    <rect x="-28" y="-186" width="24" height="14" rx="5" fill="#111"/>
    <rect x="4"   y="-186" width="24" height="14" rx="5" fill="#111"/>
    <rect x="-4"  y="-182" width="8"  height="4"  rx="2" fill="#333"/>
    <rect x="-44" y="-184" width="16" height="4"  rx="2" fill="#333"/>
    <rect x="28"  y="-184" width="16" height="4"  rx="2" fill="#333"/>
    <!-- Smirk -->
    <path d="M-8,-157 Q4,-152 14,-158" stroke="#7A4A30" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- name -->
    <text x="0" y="150" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#C0392B" text-anchor="middle" font-weight="700">JACK</text>
    <text x="0" y="171" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Antagonista</text>
  </g>

  <!-- Director Miquel (purple) -->
  <g transform="translate(1410,320)" opacity="0.7">
    <ellipse cx="0" cy="-168" rx="36" ry="22" fill="#2A1A4A"/>
    <rect x="-38" y="-110" width="76" height="130" rx="16" fill="#6A0DAD"/>
    <rect x="-62" y="-100" width="24" height="80" rx="12" fill="#6A0DAD"/>
    <rect x="38"  y="-100" width="24" height="80" rx="12" fill="#6A0DAD"/>
    <rect x="-34" y="20"   width="30" height="105" rx="10" fill="#1A1A2E"/>
    <rect x="4"   y="20"   width="30" height="105" rx="10" fill="#1A1A2E"/>
    <ellipse cx="-19" cy="130" rx="22" ry="11" fill="#2C3E8A"/>
    <ellipse cx="19"  cy="130" rx="22" ry="11" fill="#2C3E8A"/>
    <circle cx="0" cy="-168" r="38" fill="#FDBCB4"/>
    <path d="M-36,-180 Q-34,-205 -18,-210 Q0,-216 18,-210 Q34,-205 36,-180" fill="#2A1A4A"/>
    <ellipse cx="-12" cy="-174" rx="6" ry="7" fill="#FFF"/>
    <ellipse cx="12"  cy="-174" rx="6" ry="7" fill="#FFF"/>
    <circle cx="-12" cy="-173" r="4" fill="#333"/>
    <circle cx="12"  cy="-173" r="4" fill="#333"/>
    <text x="0" y="157" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#8E44AD" text-anchor="middle" font-weight="700">MIQUEL</text>
    <text x="0" y="177" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#888" text-anchor="middle">Director</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="668" width="1600" height="32" fill="#FF6B35" opacity="0.18"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FF6B35" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
