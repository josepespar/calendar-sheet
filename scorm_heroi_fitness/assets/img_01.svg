<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1A2A1A"/>
    </linearGradient>
    <linearGradient id="lp1" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg1)"/>

  <!-- Gym weight plates background decoration -->
  <circle cx="1300" cy="350" r="280" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.04"/>
  <circle cx="1300" cy="350" r="220" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.04"/>
  <circle cx="1300" cy="350" r="160" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.04"/>
  <circle cx="1300" cy="350" r="60"  fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.06"/>
  <!-- Barbell bar -->
  <rect x="950" y="340" width="700" height="20" rx="10" fill="#FFFFFF" opacity="0.05"/>
  <!-- Small plates right -->
  <circle cx="280" cy="600" r="120" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.08"/>
  <circle cx="280" cy="600" r="90"  fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.06"/>

  <!-- Left gradient overlay for text -->
  <rect width="820" height="700" fill="url(#lp1)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#666666" letter-spacing="4">CENTRE DE FITNESS</text>

  <!-- Orange rule -->
  <rect x="60" y="145" width="180" height="4" rx="2" fill="#FF6B35"/>

  <!-- Act label -->
  <text x="60" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#FF6B35" font-weight="700" letter-spacing="3">ACTE I · EL MÓN ORDINARI</text>

  <!-- Title -->
  <text x="60" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">Benvinguts</text>
  <text x="60" y="350" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">a FitCore</text>

  <!-- Subtitle -->
  <text x="60" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#AAAAAA">El primer dia de l'Harry</text>

  <!-- Character avatars (right side) -->
  <!-- Hanna -->
  <circle cx="920" cy="280" r="90" fill="#27AE60"/>
  <text x="920" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">Ha</text>
  <text x="920" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#27AE60" font-weight="700" text-anchor="middle">HANNA</text>
  <text x="920" y="425" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Mentora</text>

  <!-- Harry (dark blue) -->
  <circle cx="1130" cy="260" r="100" fill="#4A90D9"/>
  <text x="1130" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
  <text x="1130" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#4A90D9" font-weight="700" text-anchor="middle">HARRY</text>
  <text x="1130" y="422" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Protagonista</text>

  <!-- Jack -->
  <circle cx="1360" cy="280" r="90" fill="#C0392B"/>
  <text x="1360" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">J</text>
  <text x="1360" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C0392B" font-weight="700" text-anchor="middle">JACK</text>
  <text x="1360" y="425" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Antagonista</text>

  <!-- Bottom bar -->
  <rect x="0" y="668" width="1600" height="32" fill="#FF6B35" opacity="0.15"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#FF6B35" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
