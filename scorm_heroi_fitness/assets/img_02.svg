<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1A0D0D"/>
      <stop offset="100%" stop-color="#2A1A0A"/>
    </linearGradient>
    <linearGradient id="lp2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg2)"/>

  <!-- Decorative background: reception desk / shelves suggestion -->
  <rect x="850" y="480" width="700" height="20" rx="4" fill="#FFFFFF" opacity="0.04"/>
  <rect x="900" y="430" width="600" height="12" rx="4" fill="#FFFFFF" opacity="0.03"/>
  <!-- Small plant circle -->
  <ellipse cx="1480" cy="500" rx="80" ry="90" fill="#27AE60" opacity="0.06"/>
  <!-- Speech bubble suggestion -->
  <ellipse cx="1150" cy="200" rx="140" ry="80" fill="#FF6B35" opacity="0.06"/>
  <polygon points="1080,270 1060,310 1110,275" fill="#FF6B35" opacity="0.06"/>

  <!-- Decorative rings -->
  <circle cx="1300" cy="380" r="220" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.05"/>
  <circle cx="1300" cy="380" r="160" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.04"/>

  <rect width="820" height="700" fill="url(#lp2)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#666666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="145" width="180" height="4" rx="2" fill="#FF6B35"/>
  <text x="60" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#FF6B35" font-weight="700" letter-spacing="3">ACTE I · LA CRIDA</text>

  <text x="60" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">La queixa</text>
  <text x="60" y="350" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">de la Maria</text>
  <text x="60" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#AAAAAA">Primera decisió de l'Harry</text>

  <!-- Maria avatar (55 years, client) -->
  <circle cx="980" cy="270" r="95" fill="#8E44AD"/>
  <text x="980" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="980" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#8E44AD" font-weight="700" text-anchor="middle">MARIA</text>
  <text x="980" y="425" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Client · 55 anys</text>

  <!-- Connector arrow suggestion -->
  <line x1="1090" y1="270" x2="1160" y2="270" stroke="#FF6B35" stroke-width="3" stroke-dasharray="8,6" opacity="0.5"/>
  <polygon points="1165,263 1185,270 1165,277" fill="#FF6B35" opacity="0.5"/>

  <!-- Harry avatar -->
  <circle cx="1280" cy="270" r="95" fill="#4A90D9"/>
  <text x="1280" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
  <text x="1280" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#4A90D9" font-weight="700" text-anchor="middle">HARRY</text>
  <text x="1280" y="425" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Pren la decisió</text>

  <rect x="0" y="668" width="1600" height="32" fill="#FF6B35" opacity="0.15"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#FF6B35" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
