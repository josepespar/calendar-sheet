<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <linearGradient id="lp2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.82"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Gym interior background -->
  <rect width="1600" height="700" fill="url(#bg2)"/>
  <!-- Floor -->
  <rect x="750" y="560" width="850" height="140" fill="#111118"/>
  <line x1="750" y1="560" x2="1600" y2="560" stroke="#333" stroke-width="2"/>

  <!-- Gym equipment background -->
  <rect x="1420" y="340" width="160" height="230" rx="8" fill="#1A1A1A" opacity="0.7"/>
  <rect x="1430" y="320" width="140" height="30" rx="4" fill="#222"/>
  <rect x="1300" y="410" width="80" height="160" rx="4" fill="#1A1A1A" opacity="0.6"/>
  <rect x="1290" y="415" width="100" height="18" rx="4" fill="#2A2A2A" opacity="0.8"/>
  <rect x="1290" y="450" width="100" height="18" rx="4" fill="#2A2A2A" opacity="0.8"/>
  <rect x="1290" y="485" width="100" height="18" rx="4" fill="#2A2A2A" opacity="0.8"/>

  <!-- Wall accent light -->
  <rect x="750" y="85" width="850" height="6" rx="3" fill="#FF6B35" opacity="0.15"/>

  <!-- Left text overlay -->
  <rect width="1600" height="700" fill="url(#lp2)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="128" width="160" height="4" rx="2" fill="#FF6B35"/>
  <text x="60" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#FF6B35" font-weight="700" letter-spacing="3">ACTE I · LA CRIDA</text>
  <text x="60" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">La queixa</text>
  <text x="60" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">de la Maria</text>
  <text x="60" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#AAA">Primera decisió de l'Harry</text>

  <!-- MARIA character (left, upset, arms crossed) -->
  <g transform="translate(940,310)">
    <!-- hair back -->
    <ellipse cx="0" cy="-178" rx="44" ry="50" fill="#8B2500"/>
    <!-- body red/coral outfit -->
    <rect x="-40" y="-115" width="80" height="135" rx="18" fill="#C0392B"/>
    <!-- arms crossed -->
    <rect x="-68" y="-105" width="30" height="70" rx="15" fill="#C0392B"/>
    <rect x="38"  y="-105" width="30" height="70" rx="15" fill="#C0392B"/>
    <rect x="-48" y="-62" width="96" height="22" rx="10" fill="#A93226" opacity="0.8"/>
    <!-- pants -->
    <rect x="-36" y="20" width="30" height="120" rx="10" fill="#2C2C4A"/>
    <rect x="6"   y="20" width="30" height="120" rx="10" fill="#2C2C4A"/>
    <!-- shoes -->
    <ellipse cx="-21" cy="146" rx="24" ry="12" fill="#1A1A1A"/>
    <ellipse cx="21"  cy="146" rx="24" ry="12" fill="#1A1A1A"/>
    <!-- head -->
    <circle cx="0" cy="-178" r="44" fill="#F5CBA7"/>
    <!-- red hair -->
    <path d="M-44,-195 Q-46,-232 -22,-244 Q0,-252 22,-244 Q46,-232 44,-195" fill="#8B2500"/>
    <ellipse cx="-35" cy="-208" rx="14" ry="10" fill="#8B2500"/>
    <ellipse cx="35"  cy="-208" rx="14" ry="10" fill="#8B2500"/>
    <!-- eyes angry -->
    <ellipse cx="-14" cy="-184" rx="7" ry="7" fill="#FFF"/>
    <ellipse cx="14"  cy="-184" rx="7" ry="7" fill="#FFF"/>
    <circle cx="-14" cy="-183" r="4.5" fill="#333"/>
    <circle cx="14"  cy="-183" r="4.5" fill="#333"/>
    <!-- angry eyebrows -->
    <line x1="-22" y1="-196" x2="-6" y2="-193" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="6"   y1="-193" x2="22" y2="-196" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
    <!-- frown -->
    <path d="M-10,-164 Q0,-171 10,-164" stroke="#B03A2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- name -->
    <text x="0" y="174" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#E74C3C" text-anchor="middle" font-weight="700">MARIA</text>
    <text x="0" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Client · 55 anys</text>
  </g>

  <!-- Tension dashed arrow -->
  <line x1="1058" y1="360" x2="1140" y2="360" stroke="#FF6B35" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
  <polygon points="1144,354 1160,360 1144,366" fill="#FF6B35" opacity="0.5"/>

  <!-- HARRY character (right, attentive) -->
  <g transform="translate(1255,295)">
    <!-- hair back -->
    <ellipse cx="0" cy="-185" rx="42" ry="30" fill="#4A2C0A"/>
    <!-- body hoodie -->
    <rect x="-42" y="-118" width="84" height="145" rx="18" fill="#4A90D9"/>
    <!-- arms -->
    <rect x="-68" y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <rect x="40"  y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <!-- FC badge -->
    <rect x="-12" y="-100" width="24" height="20" rx="4" fill="#2C5F8A"/>
    <text x="0" y="-85" font-family="system-ui,sans-serif" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- pants -->
    <rect x="-36" y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <rect x="4"   y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <!-- shoes -->
    <ellipse cx="-20" cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <ellipse cx="20"  cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <!-- head -->
    <circle cx="0" cy="-185" r="44" fill="#FDBCB4"/>
    <!-- hair -->
    <path d="M-42,-198 Q-40,-225 -20,-232 Q0,-238 20,-232 Q40,-225 42,-198" fill="#4A2C0A"/>
    <!-- eyes attentive -->
    <ellipse cx="-14" cy="-192" rx="7" ry="8" fill="#FFF"/>
    <ellipse cx="14"  cy="-192" rx="7" ry="8" fill="#FFF"/>
    <circle cx="-14" cy="-191" r="4.5" fill="#333"/>
    <circle cx="14"  cy="-191" r="4.5" fill="#333"/>
    <!-- neutral expression -->
    <path d="M-8,-172 Q0,-168 8,-172" stroke="#C0392B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- name -->
    <text x="0" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle" font-weight="700">HARRY</text>
    <text x="0" y="207" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Pren la decisió</text>
  </g>

  <!-- Speech bubble from Maria -->
  <rect x="878" y="88" width="240" height="66" rx="12" fill="#C0392B" opacity="0.88"/>
  <polygon points="950,154 940,176 968,154" fill="#C0392B" opacity="0.88"/>
  <text x="998" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FFF" text-anchor="middle" font-weight="600">«No veig els resultats</text>
  <text x="998" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FFF" text-anchor="middle" font-weight="600">que vull!»</text>

  <!-- Bottom bar -->
  <rect x="0" y="668" width="1600" height="32" fill="#FF6B35" opacity="0.18"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FF6B35" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
