<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0A1A0A"/>
      <stop offset="100%" stop-color="#1A2A1E"/>
    </linearGradient>
    <linearGradient id="lp3" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg3)"/>

  <!-- Light bulb / knowledge motif background -->
  <circle cx="1300" cy="300" r="200" fill="none" stroke="#27AE60" stroke-width="3" opacity="0.07"/>
  <circle cx="1300" cy="300" r="140" fill="none" stroke="#27AE60" stroke-width="3" opacity="0.06"/>
  <circle cx="1300" cy="300" r="80"  fill="#27AE60" opacity="0.04"/>
  <!-- Radial lines from center (knowledge/light) -->
  <line x1="1300" y1="140" x2="1300" y2="100" stroke="#27AE60" stroke-width="3" opacity="0.1"/>
  <line x1="1413" y1="187" x2="1440" y2="160" stroke="#27AE60" stroke-width="3" opacity="0.1"/>
  <line x1="1460" y1="300" x2="1500" y2="300" stroke="#27AE60" stroke-width="3" opacity="0.1"/>
  <line x1="1413" y1="413" x2="1440" y2="440" stroke="#27AE60" stroke-width="3" opacity="0.1"/>
  <line x1="1187" y1="187" x2="1160" y2="160" stroke="#27AE60" stroke-width="3" opacity="0.1"/>
  <!-- Book/notebook motif -->
  <rect x="840" y="480" width="120" height="90" rx="6" fill="#FFFFFF" opacity="0.04"/>
  <line x1="900" y1="480" x2="900" y2="570" stroke="#FFFFFF" stroke-width="2" opacity="0.06"/>

  <rect width="820" height="700" fill="url(#lp3)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#666666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="145" width="180" height="4" rx="2" fill="#27AE60"/>
  <text x="60" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#27AE60" font-weight="700" letter-spacing="3">EL MENTOR · LA FORMACIÓ</text>

  <text x="60" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">La lliçó</text>
  <text x="60" y="350" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">de la Hanna</text>
  <text x="60" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#AAAAAA">Comunicació efectiva en acció</text>

  <!-- Hanna avatar (left, bigger as mentor) -->
  <circle cx="960" cy="265" r="105" fill="#27AE60"/>
  <text x="960" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle">Ha</text>
  <text x="960" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#27AE60" font-weight="700" text-anchor="middle">HANNA</text>
  <text x="960" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Mentora · 7 anys exp.</text>

  <!-- Knowledge flow arrow -->
  <path d="M1080,265 Q1130,240 1170,265" fill="none" stroke="#27AE60" stroke-width="4" opacity="0.5" marker-end="url(#arr)"/>
  <!-- Small dashed arrow -->
  <line x1="1075" y1="265" x2="1160" y2="265" stroke="#27AE60" stroke-width="3" stroke-dasharray="8,5" opacity="0.4"/>
  <polygon points="1163,258 1183,265 1163,272" fill="#27AE60" opacity="0.4"/>

  <!-- Harry avatar (right, learning) -->
  <circle cx="1290" cy="265" r="90" fill="#4A90D9"/>
  <text x="1290" y="283" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
  <text x="1290" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#4A90D9" font-weight="700" text-anchor="middle">HARRY</text>
  <text x="1290" y="415" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Aprenent</text>

  <rect x="0" y="668" width="1600" height="32" fill="#27AE60" opacity="0.15"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#27AE60" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
