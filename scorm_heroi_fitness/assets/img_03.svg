<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1A0A"/>
      <stop offset="100%" stop-color="#1A2A1E"/>
    </linearGradient>
    <linearGradient id="lp3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.82"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background (meeting room / office corridor) -->
  <rect width="1600" height="700" fill="url(#bg3)"/>
  <!-- Floor -->
  <rect x="750" y="570" width="850" height="130" fill="#111A11"/>
  <line x1="750" y1="570" x2="1600" y2="570" stroke="#2A3A2A" stroke-width="2"/>
  <!-- Back wall panels -->
  <rect x="850" y="90" width="200" height="500" rx="4" fill="#1A2A1A" opacity="0.5"/>
  <rect x="1100" y="90" width="200" height="500" rx="4" fill="#1A2A1A" opacity="0.5"/>
  <rect x="1350" y="90" width="200" height="500" rx="4" fill="#1A2A1A" opacity="0.5"/>
  <!-- Green accent lines on walls -->
  <rect x="850" y="90" width="200" height="5" fill="#27AE60" opacity="0.15"/>
  <rect x="1100" y="90" width="200" height="5" fill="#27AE60" opacity="0.15"/>
  <rect x="1350" y="90" width="200" height="5" fill="#27AE60" opacity="0.15"/>
  <!-- Small plant bottom right -->
  <ellipse cx="1540" cy="570" rx="50" ry="60" fill="#27AE60" opacity="0.08"/>
  <rect x="1525" y="550" width="30" height="30" rx="4" fill="#1A3A1A" opacity="0.5"/>

  <!-- Knowledge glow around Hanna -->
  <circle cx="960" cy="270" r="170" fill="#27AE60" opacity="0.04"/>
  <circle cx="960" cy="270" r="120" fill="#27AE60" opacity="0.03"/>

  <!-- Left text overlay -->
  <rect width="1600" height="700" fill="url(#lp3)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="128" width="160" height="4" rx="2" fill="#27AE60"/>
  <text x="60" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#27AE60" font-weight="700" letter-spacing="3">EL MENTOR · LA FORMACIÓ</text>
  <text x="60" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">La lliçó</text>
  <text x="60" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">de la Hanna</text>
  <text x="60" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#AAA">Comunicació efectiva en acció</text>

  <!-- HANNA (left, mentor pose, slightly larger) -->
  <g transform="translate(955,290)">
    <!-- hair back -->
    <ellipse cx="0" cy="-175" rx="50" ry="55" fill="#5C3A1E"/>
    <!-- body mentor outfit (jacket) -->
    <rect x="-44" y="-112" width="88" height="145" rx="18" fill="#27AE60"/>
    <!-- jacket lapels -->
    <polygon points="0,-112 -20,-80 0,-90" fill="#1E8A4A"/>
    <polygon points="0,-112 20,-80 0,-90" fill="#1E8A4A"/>
    <!-- arms (one raised gesturing) -->
    <rect x="-70" y="-102" width="28" height="85" rx="14" fill="#27AE60"/>
    <!-- right arm raised (teaching gesture) -->
    <rect x="42" y="-120" width="28" height="70" rx="14" fill="#27AE60" transform="rotate(-40,56,-85)"/>
    <!-- clipboard in hand -->
    <rect x="62" y="-130" width="30" height="42" rx="4" fill="#F0F0F0" opacity="0.9"/>
    <rect x="64" y="-128" width="26" height="38" rx="3" fill="#E0E0E0" opacity="0.7"/>
    <line x1="67" y1="-122" x2="88" y2="-122" stroke="#888" stroke-width="1.5"/>
    <line x1="67" y1="-115" x2="88" y2="-115" stroke="#888" stroke-width="1.5"/>
    <line x1="67" y1="-108" x2="88" y2="-108" stroke="#888" stroke-width="1.5"/>
    <!-- FC badge -->
    <rect x="-14" y="-92" width="28" height="22" rx="4" fill="#1E7A40"/>
    <text x="0" y="-76" font-family="system-ui,sans-serif" font-size="9" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- pants -->
    <rect x="-36" y="33" width="30" height="120" rx="10" fill="#1A3A1A"/>
    <rect x="6"   y="33" width="30" height="120" rx="10" fill="#1A3A1A"/>
    <!-- shoes -->
    <ellipse cx="-21" cy="158" rx="24" ry="12" fill="#111"/>
    <ellipse cx="21"  cy="158" rx="24" ry="12" fill="#111"/>
    <!-- head -->
    <circle cx="0" cy="-175" r="46" fill="#FDBCB4"/>
    <!-- curly hair front -->
    <path d="M-48,-190 Q-52,-222 -28,-234 Q0,-244 28,-234 Q52,-222 48,-190" fill="#5C3A1E"/>
    <circle cx="-36" cy="-202" r="14" fill="#5C3A1E"/>
    <circle cx="36"  cy="-202" r="14" fill="#5C3A1E"/>
    <circle cx="-18" cy="-218" r="10" fill="#5C3A1E"/>
    <circle cx="18"  cy="-218" r="10" fill="#5C3A1E"/>
    <!-- eyes (warm, knowing) -->
    <ellipse cx="-14" cy="-180" rx="6.5" ry="7" fill="#FFF"/>
    <ellipse cx="14"  cy="-180" rx="6.5" ry="7" fill="#FFF"/>
    <circle cx="-14" cy="-179" r="4" fill="#333"/>
    <circle cx="14"  cy="-179" r="4" fill="#333"/>
    <!-- warm smile -->
    <path d="M-12,-160 Q0,-152 12,-160" stroke="#C0392B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- name -->
    <text x="0" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#27AE60" text-anchor="middle" font-weight="700">HANNA</text>
    <text x="0" y="208" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Mentora · 7 anys exp.</text>
  </g>

  <!-- Knowledge arrow from Hanna to Harry -->
  <line x1="1086" y1="280" x2="1170" y2="280" stroke="#27AE60" stroke-width="3" stroke-dasharray="8,5" opacity="0.55"/>
  <polygon points="1174,273 1194,280 1174,287" fill="#27AE60" opacity="0.55"/>

  <!-- HARRY (right, learning pose - slightly turned) -->
  <g transform="translate(1290,305)">
    <!-- hair back -->
    <ellipse cx="0" cy="-185" rx="42" ry="30" fill="#4A2C0A"/>
    <!-- body hoodie -->
    <rect x="-42" y="-118" width="84" height="145" rx="18" fill="#4A90D9"/>
    <!-- arms listening (one hand to chin) -->
    <rect x="-68" y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <rect x="40"  y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <!-- hand to chin gesture -->
    <rect x="24" y="-60" width="28" height="28" rx="12" fill="#4A90D9" transform="rotate(-60,38,-46)"/>
    <!-- FC badge -->
    <rect x="-12" y="-100" width="24" height="20" rx="4" fill="#2C5F8A"/>
    <text x="0" y="-85" font-family="system-ui,sans-serif" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- pants -->
    <rect x="-36" y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <rect x="4"   y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <!-- shoes -->
    <ellipse cx="-20" cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <ellipse cx="20"  cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <!-- head -->
    <circle cx="0" cy="-185" r="44" fill="#FDBCB4"/>
    <!-- hair -->
    <path d="M-42,-198 Q-40,-225 -20,-232 Q0,-238 20,-232 Q40,-225 42,-198" fill="#4A2C0A"/>
    <!-- eyes (wide, learning) -->
    <ellipse cx="-14" cy="-192" rx="7.5" ry="8.5" fill="#FFF"/>
    <ellipse cx="14"  cy="-192" rx="7.5" ry="8.5" fill="#FFF"/>
    <circle cx="-14" cy="-191" r="4.5" fill="#333"/>
    <circle cx="14"  cy="-191" r="4.5" fill="#333"/>
    <!-- slight smile learning -->
    <path d="M-8,-171 Q0,-164 8,-171" stroke="#C0392B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- thought dot -->
    <circle cx="-30" cy="-225" r="6"  fill="#4A90D9" opacity="0.5"/>
    <circle cx="-18" cy="-240" r="9"  fill="#4A90D9" opacity="0.35"/>
    <circle cx="-4"  cy="-258" r="13" fill="#4A90D9" opacity="0.2"/>
    <!-- name -->
    <text x="0" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle" font-weight="700">HARRY</text>
    <text x="0" y="207" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Aprenent</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="668" width="1600" height="32" fill="#27AE60" opacity="0.18"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#27AE60" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
