<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A0D"/>
      <stop offset="100%" stop-color="#0D1A2A"/>
    </linearGradient>
    <linearGradient id="lp4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.82"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Office/locker room interior background -->
  <rect width="1600" height="700" fill="url(#bg4)"/>
  <!-- Floor -->
  <rect x="750" y="580" width="850" height="120" fill="#0D1218"/>
  <line x1="750" y1="580" x2="1600" y2="580" stroke="#2A2A3A" stroke-width="2"/>

  <!-- Whiteboard / planning board on wall -->
  <rect x="870" y="110" width="520" height="340" rx="10" fill="#1A2030" opacity="0.9"/>
  <rect x="870" y="110" width="520" height="340" rx="10" fill="none" stroke="#2A3A50" stroke-width="3"/>
  <!-- Board header bar -->
  <rect x="870" y="110" width="520" height="38" rx="10" fill="#2A3A50"/>
  <!-- Board lines (written notes) -->
  <line x1="900" y1="196" x2="1355" y2="196" stroke="#4A90D9" stroke-width="1.5" opacity="0.3"/>
  <line x1="900" y1="228" x2="1320" y2="228" stroke="#4A90D9" stroke-width="1.5" opacity="0.25"/>
  <line x1="900" y1="260" x2="1340" y2="260" stroke="#4A90D9" stroke-width="1.5" opacity="0.25"/>
  <line x1="900" y1="292" x2="1310" y2="292" stroke="#4A90D9" stroke-width="1.5" opacity="0.2"/>
  <line x1="900" y1="324" x2="1350" y2="324" stroke="#4A90D9" stroke-width="1.5" opacity="0.2"/>
  <line x1="900" y1="356" x2="1280" y2="356" stroke="#4A90D9" stroke-width="1.5" opacity="0.2"/>
  <line x1="900" y1="388" x2="1330" y2="388" stroke="#4A90D9" stroke-width="1.5" opacity="0.15"/>
  <!-- Checkbox squares -->
  <rect x="900" y="188" width="16" height="16" rx="3" fill="#4A90D9" opacity="0.3"/>
  <rect x="900" y="220" width="16" height="16" rx="3" fill="#4A90D9" opacity="0.3"/>
  <rect x="900" y="252" width="16" height="16" rx="3" fill="#4A90D9" opacity="0.3"/>
  <rect x="900" y="284" width="16" height="16" rx="3" fill="#4A90D9" opacity="0.25"/>
  <!-- Checkmarks in first two -->
  <path d="M903,196 L907,202 L915,192" fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M903,228 L907,234 L915,224" fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Marker / pen at bottom of board -->
  <rect x="1310" y="455" width="90" height="14" rx="7" fill="#4A90D9" opacity="0.18"/>
  <rect x="1400" y="458" width="14" height="8" rx="4" fill="#4A90D9" opacity="0.12"/>

  <!-- Desk/table edge at bottom -->
  <rect x="870" y="560" width="700" height="20" rx="4" fill="#1A2030" opacity="0.8"/>

  <!-- Left text overlay -->
  <rect width="1600" height="700" fill="url(#lp4)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="128" width="160" height="4" rx="2" fill="#4A90D9"/>
  <text x="60" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#4A90D9" font-weight="700" letter-spacing="3">REFLEXIÓ · PLANIFICACIÓ</text>
  <text x="60" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">Harry</text>
  <text x="60" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">reflexiona</text>
  <text x="60" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#AAA">Preparació i presa de decisions</text>

  <!-- HARRY (alone, pensive, slightly right of center) -->
  <g transform="translate(1260,310)">
    <!-- hair back -->
    <ellipse cx="0" cy="-185" rx="42" ry="30" fill="#4A2C0A"/>
    <!-- body hoodie -->
    <rect x="-42" y="-118" width="84" height="145" rx="18" fill="#4A90D9"/>
    <!-- arms - one resting on desk, one to chin -->
    <rect x="-68" y="-108" width="28" height="100" rx="14" fill="#4A90D9"/>
    <!-- right arm raised to temple (thinking) -->
    <rect x="40" y="-108" width="28" height="70" rx="14" fill="#4A90D9"/>
    <rect x="52" y="-60" width="24" height="24" rx="10" fill="#4A90D9" transform="rotate(-50,64,-48)"/>
    <!-- hand near chin/temple -->
    <circle cx="46" cy="-168" r="18" fill="#FDBCB4"/>
    <!-- FC badge -->
    <rect x="-12" y="-100" width="24" height="20" rx="4" fill="#2C5F8A"/>
    <text x="0" y="-85" font-family="system-ui,sans-serif" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- pants -->
    <rect x="-36" y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <rect x="4"   y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <!-- shoes -->
    <ellipse cx="-20" cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <ellipse cx="20"  cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <!-- head (slightly turned) -->
    <circle cx="0" cy="-185" r="44" fill="#FDBCB4"/>
    <!-- hair -->
    <path d="M-42,-198 Q-40,-225 -20,-232 Q0,-238 20,-232 Q40,-225 42,-198" fill="#4A2C0A"/>
    <!-- eyes (looking up/thinking) -->
    <ellipse cx="-14" cy="-192" rx="7" ry="8" fill="#FFF"/>
    <ellipse cx="14"  cy="-192" rx="7" ry="8" fill="#FFF"/>
    <circle cx="-14" cy="-194" r="4.5" fill="#333"/>
    <circle cx="14"  cy="-194" r="4.5" fill="#333"/>
    <!-- thoughtful expression -->
    <path d="M-6,-173 Q2,-170 8,-174" stroke="#C0392B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- thought bubbles above -->
    <circle cx="-50" cy="-225" r="7"  fill="#4A90D9" opacity="0.45"/>
    <circle cx="-38" cy="-245" r="11" fill="#4A90D9" opacity="0.3"/>
    <circle cx="-22" cy="-268" r="16" fill="#4A90D9" opacity="0.18"/>
    <!-- name -->
    <text x="0" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle" font-weight="700">HARRY</text>
    <text x="0" y="207" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Pren decisions</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="668" width="1600" height="32" fill="#4A90D9" opacity="0.18"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#4A90D9" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
