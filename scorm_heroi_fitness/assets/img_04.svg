<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1A1A0D"/>
      <stop offset="100%" stop-color="#0D1A2A"/>
    </linearGradient>
    <linearGradient id="lp4" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg4)"/>

  <!-- Whiteboard / planning board suggestion -->
  <rect x="950" y="120" width="480" height="360" rx="12" fill="#FFFFFF" opacity="0.04"/>
  <rect x="950" y="120" width="480" height="36"  rx="12" fill="#FFFFFF" opacity="0.06"/>
  <!-- Board lines (text lines on whiteboard) -->
  <line x1="975" y1="200" x2="1390" y2="200" stroke="#FFFFFF" stroke-width="2" opacity="0.06"/>
  <line x1="975" y1="240" x2="1340" y2="240" stroke="#FFFFFF" stroke-width="2" opacity="0.05"/>
  <line x1="975" y1="280" x2="1360" y2="280" stroke="#FFFFFF" stroke-width="2" opacity="0.05"/>
  <line x1="975" y1="320" x2="1300" y2="320" stroke="#FFFFFF" stroke-width="2" opacity="0.04"/>
  <line x1="975" y1="360" x2="1350" y2="360" stroke="#FFFFFF" stroke-width="2" opacity="0.04"/>
  <!-- Checklist boxes on board -->
  <rect x="975" y="192" width="16" height="16" rx="3" fill="#FF6B35" opacity="0.2"/>
  <rect x="975" y="232" width="16" height="16" rx="3" fill="#FF6B35" opacity="0.2"/>
  <rect x="975" y="272" width="16" height="16" rx="3" fill="#FF6B35" opacity="0.2"/>
  <!-- Marker / pen decoration -->
  <rect x="1340" y="490" width="80" height="14" rx="7" fill="#FF6B35" opacity="0.12"/>

  <rect width="820" height="700" fill="url(#lp4)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#666666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="145" width="180" height="4" rx="2" fill="#4A90D9"/>
  <text x="60" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#4A90D9" font-weight="700" letter-spacing="3">REFLEXIÓ · PLANIFICACIÓ</text>

  <text x="60" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">Harry</text>
  <text x="60" y="350" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">reflexiona</text>
  <text x="60" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#AAAAAA">Preparació i presa de decisions</text>

  <!-- Harry large avatar centered on right -->
  <circle cx="1250" cy="290" r="120" fill="#4A90D9"/>
  <text x="1250" y="312" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
  <text x="1250" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="28" fill="#4A90D9" font-weight="700" text-anchor="middle">HARRY</text>
  <text x="1250" y="472" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#888888" text-anchor="middle">Pren decisions</text>

  <!-- Thought dots (pondering) -->
  <circle cx="1110" cy="210" r="8"  fill="#4A90D9" opacity="0.4"/>
  <circle cx="1135" cy="185" r="12" fill="#4A90D9" opacity="0.3"/>
  <circle cx="1168" cy="158" r="18" fill="#4A90D9" opacity="0.2"/>

  <rect x="0" y="668" width="1600" height="32" fill="#4A90D9" opacity="0.15"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#4A90D9" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
