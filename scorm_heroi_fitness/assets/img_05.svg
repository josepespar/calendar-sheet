<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0D0D"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="lp5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.82"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background - meeting room/lounge area -->
  <rect width="1600" height="700" fill="url(#bg5)"/>
  <!-- Floor -->
  <rect x="750" y="575" width="850" height="125" fill="#110808"/>
  <line x1="750" y1="575" x2="1600" y2="575" stroke="#2A1A1A" stroke-width="2"/>

  <!-- Meeting table suggestion -->
  <ellipse cx="1200" cy="530" rx="340" ry="55" fill="#1A0A0A" opacity="0.7"/>
  <ellipse cx="1200" cy="525" rx="340" ry="52" fill="none" stroke="#3A2020" stroke-width="2"/>

  <!-- Back wall corner lines -->
  <line x1="820" y1="90" x2="820"  y2="575" stroke="#2A1A1A" stroke-width="2" opacity="0.5"/>
  <line x1="820" y1="450" x2="1600" y2="450" stroke="#2A1A1A" stroke-width="1" opacity="0.3"/>

  <!-- Tension arc between characters -->
  <path d="M1025,240 Q1200,155 1375,240" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0.12" stroke-dasharray="12,8"/>

  <!-- Left text overlay -->
  <rect width="1600" height="700" fill="url(#lp5)"/>

  <!-- FitCore wordmark -->
  <text x="60" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="900">
    <tspan fill="#FFFFFF">FIT</tspan><tspan fill="#FF6B35">CORE</tspan>
  </text>
  <text x="60" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#666" letter-spacing="4">CENTRE DE FITNESS</text>
  <rect x="60" y="128" width="160" height="4" rx="2" fill="#FF6B35"/>
  <text x="60" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#FF6B35" font-weight="700" letter-spacing="3">LA PROVA SUPREMA</text>
  <text x="60" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">La conversa</text>
  <text x="60" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#FFF">difícil</text>
  <text x="60" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#AAA">Assertivitat i gestió emocional</text>

  <!-- HARRY (left of conversation, assertive stance) -->
  <g transform="translate(980,300)">
    <!-- hair back -->
    <ellipse cx="0" cy="-185" rx="42" ry="30" fill="#4A2C0A"/>
    <!-- body hoodie blue -->
    <rect x="-42" y="-118" width="84" height="145" rx="18" fill="#4A90D9"/>
    <!-- arms open/assertive -->
    <rect x="-68" y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <rect x="40"  y="-108" width="28" height="90" rx="14" fill="#4A90D9"/>
    <!-- hands forward (assertive gesture) -->
    <ellipse cx="-54" cy="-18" rx="16" ry="14" fill="#FDBCB4"/>
    <ellipse cx="54"  cy="-18" rx="16" ry="14" fill="#FDBCB4"/>
    <!-- FC badge -->
    <rect x="-12" y="-100" width="24" height="20" rx="4" fill="#2C5F8A"/>
    <text x="0" y="-85" font-family="system-ui,sans-serif" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">FC</text>
    <!-- pants -->
    <rect x="-36" y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <rect x="4"   y="27" width="32" height="130" rx="10" fill="#1A1A2E"/>
    <!-- shoes -->
    <ellipse cx="-20" cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <ellipse cx="20"  cy="160" rx="25" ry="13" fill="#2C3E8A"/>
    <!-- head -->
    <circle cx="0" cy="-185" r="44" fill="#FDBCB4"/>
    <!-- hair -->
    <path d="M-42,-198 Q-40,-225 -20,-232 Q0,-238 20,-232 Q40,-225 42,-198" fill="#4A2C0A"/>
    <!-- eyes (direct, confident) -->
    <ellipse cx="-14" cy="-192" rx="7" ry="8" fill="#FFF"/>
    <ellipse cx="14"  cy="-192" rx="7" ry="8" fill="#FFF"/>
    <circle cx="-14" cy="-191" r="4.5" fill="#333"/>
    <circle cx="14"  cy="-191" r="4.5" fill="#333"/>
    <!-- confident slight smile -->
    <path d="M-9,-172 Q0,-166 9,-172" stroke="#C0392B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- name -->
    <text x="0" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle" font-weight="700">HARRY</text>
    <text x="0" y="207" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Assertivitat</text>
  </g>

  <!-- VS tension indicator -->
  <circle cx="1190" cy="295" r="26" fill="#FF6B35" opacity="0.65"/>
  <text x="1190" y="303" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="900" fill="#FFF" text-anchor="middle">↔</text>

  <!-- JORDI (right, critical triathlete, imposing) -->
  <g transform="translate(1400,295)">
    <!-- hair back - short dark -->
    <ellipse cx="0" cy="-188" rx="44" ry="28" fill="#1A1A1A"/>
    <!-- body - athletic compression shirt -->
    <rect x="-44" y="-120" width="88" height="148" rx="18" fill="#E67E22"/>
    <!-- arms (muscular, slightly crossed/defensive) -->
    <rect x="-72" y="-108" width="30" height="95" rx="15" fill="#E67E22"/>
    <rect x="42"  y="-108" width="30" height="95" rx="15" fill="#E67E22"/>
    <!-- arms slightly crossed -->
    <rect x="-55" y="-45" width="110" height="22" rx="10" fill="#C0642A" opacity="0.7"/>
    <!-- triathlete number bib suggestion -->
    <rect x="-18" y="-100" width="36" height="44" rx="4" fill="#FFF" opacity="0.9"/>
    <text x="0" y="-72" font-family="system-ui,sans-serif" font-size="20" fill="#E67E22" text-anchor="middle" font-weight="900">42</text>
    <!-- pants - cycling/athletic shorts -->
    <rect x="-38" y="28" width="34" height="80" rx="10" fill="#1A1A1A"/>
    <rect x="4"   y="28" width="34" height="80" rx="10" fill="#1A1A1A"/>
    <!-- legs muscular -->
    <rect x="-36" y="108" width="30" height="60" rx="8" fill="#C07A52"/>
    <rect x="6"   y="108" width="30" height="60" rx="8" fill="#C07A52"/>
    <!-- shoes/trainers -->
    <ellipse cx="-21" cy="174" rx="26" ry="13" fill="#333"/>
    <ellipse cx="21"  cy="174" rx="26" ry="13" fill="#333"/>
    <!-- head -->
    <circle cx="0" cy="-188" r="44" fill="#C07A52"/>
    <!-- short hair -->
    <path d="M-44,-206 Q0,-225 44,-206 L42,-188 Q0,-196 -42,-188 Z" fill="#1A1A1A" opacity="0.7"/>
    <!-- eyes (critical, narrowed slightly) -->
    <ellipse cx="-14" cy="-194" rx="7" ry="6.5" fill="#FFF"/>
    <ellipse cx="14"  cy="-194" rx="7" ry="6.5" fill="#FFF"/>
    <circle cx="-14" cy="-193" r="4.5" fill="#333"/>
    <circle cx="14"  cy="-193" r="4.5" fill="#333"/>
    <!-- slight frown/skeptical expression -->
    <path d="M-9,-174 Q0,-179 9,-174" stroke="#7A4A30" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- skeptical eyebrow slightly raised -->
    <line x1="-22" y1="-205" x2="-6" y2="-203" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <line x1="6"   y1="-205" x2="22" y2="-202" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <!-- name -->
    <text x="0" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#E67E22" text-anchor="middle" font-weight="700">JORDI</text>
    <text x="0" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">Triatleta · Crític</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="668" width="1600" height="32" fill="#FF6B35" opacity="0.18"/>
  <text x="800" y="689" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FF6B35" text-anchor="middle" letter-spacing="2">HABILITATS SOCIALS PER A ENTRENADORS · EL VIATGE DE L'HEROI</text>
</svg>
