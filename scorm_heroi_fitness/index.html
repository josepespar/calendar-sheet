<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>El Viatge de l'Heroi – Habilitats Socials · FitCore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ══ HEADER ══════════════════════════════════════════ -->
  <header id="header">
    <div id="header-row1">
      <div id="header-left">
        <span id="stage-label">El Món Ordinari</span>
        <div id="scene-title">Carregant...</div>
      </div>
      <div id="header-right">
        <span id="score-display">0 pts</span>
        <button id="map-toggle-btn" aria-label="Mapa del viatge">🗺</button>
      </div>
    </div>
    <div id="progress-container">
      <div id="progress-bar-track">
        <div id="progress-bar-fill"></div>
      </div>
      <span id="progress-label">0/28</span>
    </div>
  </header>

  <!-- ══ SCENE AREA ═══════════════════════════════════════ -->
  <main id="scene-area">

    <!-- Imatge de l'escena -->
    <div id="scene-image-container" style="display:none">
      <img id="scene-image" alt="" loading="eager">
    </div>

    <!-- Personatge -->
    <div id="character-block">
      <div id="character-avatar">H</div>
      <span id="character-name">Harry</span>
    </div>

    <!-- Narració -->
    <div id="narrative-text">
      <p>Carregant l'escena...</p>
    </div>

    <!-- Diàleg del personatge -->
    <div id="dialogue-box" style="display:none">
      <span id="dialogue-char-name"></span>
      <div id="dialogue-text"></div>
    </div>

    <!-- Bloc pedagògic -->
    <div id="pedagogic-block" style="display:none">
      <span id="pedagogic-title"></span>
      <div id="pedagogic-text"></div>
    </div>

    <!-- Interacció -->
    <div id="interaction-area"></div>

  </main>
</div>

<!-- ══ FEEDBACK OVERLAY ══════════════════════════════════ -->
<div id="feedback-overlay" role="dialog" aria-modal="true" aria-label="Resultat de la decisió">
  <div id="feedback-modal">
    <div id="feedback-icon" class="feedback-icon">✓</div>
    <div id="feedback-pts">+10 punts</div>
    <div id="feedback-text"></div>
    <button id="feedback-continue" class="btn btn-primary btn-enabled">Continua →</button>
  </div>
</div>

<!-- ══ JOURNEY MAP OVERLAY ══════════════════════════════ -->
<div id="map-overlay" role="dialog" aria-modal="true" aria-label="Mapa del viatge">
  <div id="map-modal">
    <div id="map-modal-header">
      <span id="map-modal-title">🗺 El Viatge de l'Heroi</span>
      <button id="map-close-btn" aria-label="Tancar">✕ Tancar</button>
    </div>
    <div id="journey-map-content"></div>
  </div>
</div>

<script src="js/scorm.js"></script>
<script src="js/scenario.js"></script>
<script>
  document.getElementById('map-toggle-btn').addEventListener('click', function () {
    document.getElementById('map-overlay').style.display = 'flex';
  });
  document.getElementById('map-close-btn').addEventListener('click', function () {
    document.getElementById('map-overlay').style.display = 'none';
  });
  document.getElementById('map-overlay').addEventListener('click', function (e) {
    if (e.target === this) this.style.display = 'none';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.getElementById('map-overlay').style.display = 'none';
      document.getElementById('feedback-overlay').style.display = 'none';
    }
  });
  window.addEventListener('DOMContentLoaded', function () {
    Engine.init();
  });
</script>
</body>
</html>
