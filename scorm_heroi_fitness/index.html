<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Viatge de l'Heroi – Habilitats Socials per a Entrenadors · FitCore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ══ HEADER ══════════════════════════════════════════ -->
  <header id="header">
    <div id="header-left">
      <span id="stage-label">El Món Ordinari</span>
      <div id="scene-title">Carregant...</div>
    </div>
    <div id="header-right">
      <span id="score-display">Puntuació: 0</span>
      <button id="map-toggle-btn" aria-label="Mapa del viatge">🗺 Mapa</button>
    </div>
    <div id="progress-container" style="width:100%">
      <div id="progress-bar-track">
        <div id="progress-bar-fill"></div>
      </div>
      <span id="progress-label">0/13 escenes</span>
    </div>
  </header>

  <!-- ══ SCENE AREA ═══════════════════════════════════════ -->
  <main id="scene-area">

    <!-- Personatge -->
    <div id="character-block">
      <div id="character-avatar">H</div>
      <span id="character-name">Harry</span>
    </div>

    <!-- Narració -->
    <div id="narrative-text">
      <p>Carregant l'escena...</p>
    </div>

    <!-- Diàleg del personatge -->
    <div id="dialogue-box" style="display:none">
      <span id="dialogue-char-name"></span>
      <div id="dialogue-text"></div>
    </div>

    <!-- Bloc pedagògic -->
    <div id="pedagogic-block" style="display:none">
      <span id="pedagogic-title"></span>
      <div id="pedagogic-text"></div>
    </div>

    <!-- Interacció (decisions / checklist / ordeal / epilogue) -->
    <div id="interaction-area"></div>

  </main>
</div><!-- /#app -->

<!-- ══ FEEDBACK OVERLAY ══════════════════════════════════ -->
<div id="feedback-overlay" role="dialog" aria-modal="true" aria-label="Feedback de la decisió">
  <div id="feedback-modal">
    <div id="feedback-icon" class="feedback-icon">✓</div>
    <div id="feedback-pts">+10 punts</div>
    <div id="feedback-text"></div>
    <button id="feedback-continue" class="btn btn-primary btn-enabled">Continua →</button>
  </div>
</div>

<!-- ══ JOURNEY MAP OVERLAY ══════════════════════════════ -->
<div id="map-overlay" role="dialog" aria-modal="true" aria-label="Mapa del viatge de l'heroi">
  <div id="map-modal">
    <div id="map-modal-header">
      <span id="map-modal-title">🗺 El Viatge de l'Heroi</span>
      <button id="map-close-btn" aria-label="Tancar mapa">✕</button>
    </div>
    <div id="journey-map-content">
      <!-- Rendered by UI.updateJourneyMap -->
    </div>
  </div>
</div>

<!-- ══ SCRIPTS ═══════════════════════════════════════════ -->
<script src="js/scorm.js"></script>
<script src="js/scenario.js"></script>
<script>
  // Journey map toggle
  document.getElementById('map-toggle-btn').addEventListener('click', function () {
    document.getElementById('map-overlay').style.display = 'flex';
  });
  document.getElementById('map-close-btn').addEventListener('click', function () {
    document.getElementById('map-overlay').style.display = 'none';
  });
  document.getElementById('map-overlay').addEventListener('click', function (e) {
    if (e.target === this) this.style.display = 'none';
  });

  // Feedback overlay close on backdrop click
  document.getElementById('feedback-overlay').addEventListener('click', function (e) {
    if (e.target === this) {
      // Do not close feedback on backdrop – force button click
    }
  });

  // Keyboard: Escape closes overlays
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.getElementById('map-overlay').style.display = 'none';
    }
  });

  // Boot
  window.addEventListener('DOMContentLoaded', function () {
    Engine.init();
  });
</script>
</body>
</html>
